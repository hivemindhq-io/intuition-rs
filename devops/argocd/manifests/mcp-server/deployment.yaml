---
# Deployment for MCP server
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  namespace: default
  labels:
    app: mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-server
  template:
    metadata:
      labels:
        app: mcp-server
    spec:
      containers:
      - name: mcp-server
        image: ghcr.io/0xintuition/intuition-mcp-server:test-francois
        ports:
        - containerPort: 9000
          name: http
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
---
# Service to expose the MCP server
apiVersion: v1
kind: Service
metadata:
  name: mcp-server-service
  namespace: default
spec:
  selector:
    app: mcp-server
  ports:
  - protocol: TCP
    port: 80
    targetPort: 9000
    name: http
  type: ClusterIP
---
# Ingress to serve the MCP server under a domain
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcp-server-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    kubernetes.io/ingress.class: "nginx"
spec:
  rules:
  - host: your-domain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mcp-server-service
            port:
              number: 80
  # Uncomment and configure if TLS is needed
  # tls:
  # - hosts:
  #   - your-domain.com
  #   secretName: mcp-server-tls

---
# Deployment for MCP server
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  namespace: default
  labels:
    app: mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-server
  template:
    metadata:
      labels:
        app: mcp-server
    spec:
      containers:
      - name: mcp-server
        image: ghcr.io/0xintuition/intuition-mcp-server:test-francois
        ports:
        - containerPort: 9000
          name: http
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
---
# Service to expose the MCP server
apiVersion: v1
kind: Service
metadata:
  name: mcp-server-service
  namespace: default
spec:
  selector:
    app: mcp-server
  ports:
  - protocol: TCP
    port: 80
    targetPort: 9000
    name: http
  type: ClusterIP
---
# Ingress to serve the MCP server under a domain
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcp-server-ingress
  namespace: default
  annotations:
    alb.ingress.kubernetes.io/scheme: "internet-facing"
    alb.ingress.kubernetes.io/target-type: "ip"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/certificate-arn: >-
      # TODO: change to correct certificate
      arn:aws:acm:us-west-2:064662847354:certificate/8bc44099-61f9-41a9-a2b1-4d68b739dd5b
    external-dns.alpha.kubernetes.io/hostname: mcp-server.intuition.sh
spec:
  ingressClassName: alb
  rules:
  - host: mcp-server.intuition.sh
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mcp-server-service
            port:
              number: 80
  # Uncomment and configure if TLS is needed
  # tls:
  # - hosts:
  #   - your-domain.com
  #   secretName: mcp-server-tls

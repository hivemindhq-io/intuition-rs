services:

  
  resolver_consumer:
    image: consumer:local-itemlist
    build:
      context: ..
      dockerfile: apps/consumer/Dockerfile
    command: ["/app/consumer", "--mode", "resolver"]
    environment:
      HTTP_PROXY: ''
      HTTPS_PROXY: ''
      http_proxy: ''
      https_proxy: ''
      NO_PROXY: '*'
      no_proxy: '*'
      CONSUMER_TYPE: 'redis_streams'
      DATABASE_URL: 'postgres://postgres:postgres@database:5435/storage'
      ENS_CONTRACT_ADDRESS: '0x00000000000C2E074eC69A0dFb2997BA6C7d2e1e'
      IMAGE_GUARD_URL: 'http://api:3000'
      IPFS_GATEWAY_URL: 'http://ipfs:8080'
      IPFS_UPLOAD_URL: 'http://ipfs:5001'
      IPFS_UPLOAD_STREAM: 'ipfs_upload_stream'
      PINATA_API_JWT: $PINATA_API_JWT
      PINATA_GATEWAY_TOKEN: $PINATA_GATEWAY_TOKEN
      PG_MIN_CONNECTIONS: '5'
      RESOLVER_STREAM: 'resolver_stream'
      # Intuition mainnet (1155). Override to 31337 only for local anvil indexing.
      RPC_URL_BASE: "http://prod-rpc-proxy:3008/1155/proxy"
      RPC_URL_MAINNET: "http://prod-rpc-proxy:3008/1/proxy"
      RUST_LOG: 'info'
      BACKEND_SCHEMA: 'public'
      REDIS_URL: 'redis://redis:6379'
      # RPC URLs for CAIP-22 multi-chain NFT resolution
      BASE_MAINNET_RPC_URL: $BASE_MAINNET_RPC_URL
      BASE_SEPOLIA_RPC_URL: $BASE_SEPOLIA_RPC_URL
      ETHEREUM_MAINNET_RPC_URL: $ETHEREUM_MAINNET_RPC_URL
      ETHEREUM_SEPOLIA_RPC_URL: $ETHEREUM_SEPOLIA_RPC_URL
      LINEA_MAINNET_RPC_URL: $LINEA_MAINNET_RPC_URL
      LINEA_SEPOLIA_RPC_URL: $LINEA_SEPOLIA_RPC_URL
      TRUST_TESTNET_RPC_URL: $TRUST_TESTNET_RPC_URL
      TRUST_MAINNET_RPC_URL: $TRUST_MAINNET_RPC_URL
      LOCAL_INTUITION_RPC_URL: $LOCAL_INTUITION_RPC_URL
      POLYGON_AMOY_RPC_URL: $POLYGON_AMOY_RPC_URL
    restart: always
    volumes:
      - ./logs:/app/logs
    deploy:
      replicas: 1

  
  ipfs_upload_consumer:
    image: consumer:local-itemlist
    build:
      context: ..
      dockerfile: apps/consumer/Dockerfile
    command: ["/app/consumer", "--mode", "ipfs-upload"]
    environment:
      HTTP_PROXY: ''
      HTTPS_PROXY: ''
      http_proxy: ''
      https_proxy: ''
      NO_PROXY: '*'
      no_proxy: '*'
      CONSUMER_TYPE: 'redis_streams'
      DATABASE_URL: 'postgres://postgres:postgres@database:5435/storage'
      IMAGE_GUARD_URL: 'http://api:3000'
      IPFS_GATEWAY_URL: 'http://ipfs:8080'
      IPFS_UPLOAD_URL: 'http://ipfs:5001'
      PINATA_API_JWT: $PINATA_API_JWT
      PINATA_GATEWAY_TOKEN: $PINATA_GATEWAY_TOKEN
      PG_MIN_CONNECTIONS: '5'
      IPFS_UPLOAD_STREAM: 'ipfs_upload_stream'
      RUST_LOG: 'info'
      BACKEND_SCHEMA: 'public'
      REDIS_URL: 'redis://redis:6379'
    restart: always
    volumes:
      - ./logs:/app/logs
    deploy:
      replicas: 2
    
  decoded_consumer:
    container_name: decoded_consumer
    image: consumer:local-itemlist
    build:
      context: ..
      dockerfile: apps/consumer/Dockerfile
    command: ["/app/consumer", "--mode", "decoded"]
    environment:
      HTTP_PROXY: ''
      HTTPS_PROXY: ''
      http_proxy: ''
      https_proxy: ''
      NO_PROXY: '*'
      no_proxy: '*'
      CONSUMER_TYPE: 'redis_hybrid'
      INDEXER_DATABASE_URL: "postgres://postgres:postgres@database:5435/storage"
      INDEXER_SCHEMA: $INDEXER_SCHEMA
      ENVIRONMENT_NAME: "local_development"
      # Keep concurrency low against the public Intuition RPC
      THREADS: '2'
      INITIAL_CONTRACT_VERSION: $INITIAL_CONTRACT_VERSION
      CONSUMER_METRICS_API_PORT: '3002'
      DATABASE_URL: 'postgres://postgres:postgres@database:5435/storage'
      DECODED_LOGS_STREAM: 'decoded_logs_stream'
      INTUITION_CONTRACT_ADDRESS: $INTUITION_CONTRACT_ADDRESS
      LOCALSTACK_URL: 'http://redis:6379'
      PG_MIN_CONNECTIONS: '20'
      RESOLVER_STREAM: 'resolver_stream'
      # Intuition mainnet (1155). Override to 31337 only for local anvil indexing.
      RPC_URL_BASE: "http://prod-rpc-proxy:3008/1155/proxy"
      RUST_LOG: 'info'
      BACKEND_SCHEMA: 'public'
      REDIS_URL: 'redis://redis:6379'
      LOG_LEVEL: 'info'
    restart: always
    volumes:
      - ./logs:/app/logs
    ports:
      - 3002:3002

    
  api:
    container_name: api
    image: ghcr.io/0xintuition/image-guard:2.0.21
    environment:
      HTTP_PROXY: ''
      HTTPS_PROXY: ''
      http_proxy: ''
      https_proxy: ''
      NO_PROXY: '*'
      no_proxy: '*'
      CLASSIFICATION_API_PORT: '3000'
      DATABASE_URL: 'postgres://postgres:postgres@database:5435/storage'
      HF_TOKEN: ''
      IPFS_GATEWAY_URL: 'http://ipfs:8080'
      IPFS_UPLOAD_URL: 'http://ipfs:5001'
      PINATA_API_JWT: $PINATA_API_JWT
      RUST_LOG: 'info'
      FLAG_LOCAL_WITH_CLASSIFICATION: 'true'
      BE_SCHEMA: 'public'
      IMAGE_API_SCHEMA: 'cached_images'
      INDEXER_DATABASE_URL: 'postgres://postgres:postgres@database:5435/storage'
    ports:
      - 3005:3000
    restart: always
    
  prod-rpc-proxy:
    container_name: prod-rpc-proxy
    image: ghcr.io/0xintuition/rpc-proxy:3.0.1
    environment:
      HTTP_PROXY: ''
      HTTPS_PROXY: ''
      http_proxy: ''
      https_proxy: ''
      NO_PROXY: '*'
      no_proxy: '*'
      PROXY_DATABASE_URL: 'postgres://postgres:postgres@database:5435/storage'
      PROXY_API_PORT: '3008'
      PROXY_SCHEMA: "rpc_proxy"
      BASE_MAINNET_RPC_URL: $BASE_MAINNET_RPC_URL
      BASE_SEPOLIA_RPC_URL: $BASE_SEPOLIA_RPC_URL
      ETHEREUM_MAINNET_RPC_URL: $ETHEREUM_MAINNET_RPC_URL
      ETHEREUM_SEPOLIA_RPC_URL: $ETHEREUM_SEPOLIA_RPC_URL
      LINEA_MAINNET_RPC_URL: $LINEA_MAINNET_RPC_URL
      LINEA_SEPOLIA_RPC_URL: $LINEA_SEPOLIA_RPC_URL
      TRUST_TESTNET_RPC_URL: $TRUST_TESTNET_RPC_URL
      TRUST_MAINNET_RPC_URL: $TRUST_MAINNET_RPC_URL
      LOCAL_INTUITION_RPC_URL: $LOCAL_INTUITION_RPC_URL
      POLYGON_AMOY_RPC_URL: $POLYGON_AMOY_RPC_URL
      RUST_LOG: 'info'
    restart: always
    ports:
      - 3008:3008

  chart-api:
    container_name: chart-api
    image: ghcr.io/0xintuition/chart-api:0.9.97
    environment:
      HTTP_PROXY: ''
      HTTPS_PROXY: ''
      http_proxy: ''
      https_proxy: ''
      NO_PROXY: '*'
      no_proxy: '*'
      CHART_API_PORT: '3010'
      DATABASE_URL: 'postgres://postgres:postgres@database:5435/storage'
      REDIS_URL: 'redis://redis:6379'
      RUST_LOG: 'info'
    restart: always
    ports:
      - 3010:3010

  histocrawler:
    container_name: histocrawler
    extra_hosts:
      - "host.docker.internal:host-gateway"
    image: histocrawler:local-backoff
    build:
      context: ..
      dockerfile: apps/histocrawler/Dockerfile
    # Avoid tight Docker crash-loops when upstream RPC is briefly unreachable.
    # Built from local apps/histocrawler with process-level backoff.
    restart: on-failure:30
    environment:
      HTTP_PROXY: ''
      HTTPS_PROXY: ''
      http_proxy: ''
      https_proxy: ''
      NO_PROXY: '*'
      no_proxy: '*'
      HISTOCRAWLER_DATABASE_URL: 'postgres://postgres:postgres@database:5435/storage'
      INDEXER_SCHEMA: $INDEXER_SCHEMA
      RUST_LOG: 'info'
      # Mainnet activity is concentrated in roughly the first 300k blocks; the
      # millions of blocks after that are almost entirely empty, so a small batch
      # cap turns the backfill into weeks of empty round-trips. Adaptive batching
      # shrinks these again on dense ranges, and halves on oversized responses.
      HISTOCRAWLER_MAX_BATCH_SIZE: '5000'
      HISTOCRAWLER_MAX_LOGS_PER_REQUEST: '20000'
      HISTOCRAWLER_INTER_BATCH_DELAY_MS: '500'
      HISTOCRAWLER_TIMESTAMP_DELAY_MS: '20'
    depends_on:
      prod-rpc-proxy:
        condition: service_started

  integration-tests:
    container_name: integration-tests
    build:
      context: ../integration-tests
      dockerfile: Dockerfile
    environment:
      - ETHEREUM_RPC_URL=http://prod-rpc-proxy:3008/1/proxy
      - GRAPHQL_API_URL=http://graphql-engine:8080/v1/graphql
      - IPFS_API_URL=http://api:3000/upload_json_to_ipfs
      - VITE_INTUITION_CONTRACT_ADDRESS=$INTUITION_CONTRACT_ADDRESS

networks:
  intuition-be:
    driver: bridge
    external: true
    
volumes:
  raw_consumer:
  decoded_consumer:
